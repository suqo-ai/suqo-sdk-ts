name: Release

# Ticket 10 (Packaging & release). Publishes @suqo/sdk to npm with provenance whenever a version
# tag is pushed.
#
# 1.0.0 shipped 2026-09-11 via a static NPM_TOKEN. This workflow now uses npm Trusted Publishing
# (OIDC) instead — no token, no secret to rotate or leak. That requires a one-time, per-package
# setup step on npmjs.com that this repo can't do for itself: on
# https://www.npmjs.com/package/@suqo/sdk/access, under "Trusted Publisher", register GitHub
# Actions with organization "suqo-ai", repository "suqo-sdk-ts", workflow filename "release.yml",
# with direct publish left UNCHECKED (staged-only — the more secure of the two options, chosen
# deliberately over matching the old fully-automated flow). Until that's registered AND confirmed
# working on a real tagged release, this workflow has no working fallback -- the NPM_TOKEN GitHub
# secret is left in place, unused by this file, purely as a rollback safety net (revert this commit
# to go back to token-based publishing if OIDC doesn't work). Only delete NPM_TOKEN once a real
# release has staged successfully through this path.
#
# IMPORTANT — this workflow no longer fully automates a release. A tag push runs every check and
# then STAGES the package; it does NOT go live. A human must separately approve the staged version
# with 2FA before anyone can install it — either `npm stage approve <stage-id>` (the stage-id is
# printed in this job's "Publish to npm (staged)" step output, and 2FA is required at approval
# time only, never at staging time) or the "Approve" button on npmjs.com's "Staged Packages" tab.
# This is intentional: staging needs no 2FA and can't be blocked by CI, but nothing reaches real
# users without a human in the loop, so a compromised workflow/token can at most stage a version,
# never publish one.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  # The whole point of this workflow: without id-token, GitHub can't mint the OIDC token npm's
  # registry exchanges for a short-lived publish credential -- there is no other auth path here.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # v6 specifically -- earlier setup-node versions predate npm trusted-publishing support and
      # silently fall back to needing a token, which this workflow no longer has.
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm CLI >= 11.5.1; Node 22's bundled npm can lag behind that on an
      # older runner image. Cheap enough to always take latest rather than pin-and-forget a version
      # that quietly becomes too old again later.
      - run: npm install -g npm@latest

      - run: npm ci

      # Same gate CI runs on every PR — re-run here too rather than trusting that the tagged
      # commit already passed it. A tag can be pushed to any commit, not only one CI already
      # blessed.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Typecheck examples
        run: npm run typecheck:examples

      - name: Codegen drift check
        run: npm run codegen:check

      - name: Verify tag matches package.json version
        # A tag of v1.2.3 must publish exactly package.json's "1.2.3" — catches the human error of
        # tagging without bumping the version (or bumping without tagging) before it ships the
        # wrong artifact under the wrong version number.
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME (version $TAG_VERSION) does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Publish to npm (staged)
        # `npm stage publish`, not `npm publish` — the trusted publisher on npmjs.com is
        # registered stage-only (direct publish left unchecked, deliberately, for the 2FA-gated
        # human-approval step this buys — see the top-of-file comment). Takes the same flags as
        # npm publish and needs no 2FA/OTP itself; 2FA is deferred to the separate approval step a
        # human still has to perform afterward.
        #
        # --access public: kept explicit even though the package is already public -- harmless
        # no-op now, but guards against ever silently reverting to restricted.
        # --provenance: kept explicit too, even though OIDC trusted publishing is documented to
        # attach provenance automatically -- a real-world report of this exact setup found that
        # claim didn't hold and the flag was still required, so trust the flag over the doc.
        # No NODE_AUTH_TOKEN here — that's the entire point of trusted publishing: npm exchanges
        # this job's OIDC token (from the `id-token: write` permission above) against the trusted
        # publisher registered on npmjs.com, no secret involved at all.
        run: npm stage publish --access public --provenance
